<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les quadrilatères – Le Labo des Savoirs</title>
<style>
:root{--n:#1b2a4a;--g:#d9a520;--b:#f6efe0;--w:#fffdf7;--ok:#4f9d2d;--ko:#c8432b}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--n);font:17px/1.5 "Trebuchet MS",Verdana,sans-serif}
header{background:var(--n);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 18px}
header img{height:70px;background:#fff;border-radius:50%;padding:2px}header h1{margin:0;font:700 1.5rem Georgia,serif;color:var(--g)}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px;background:#fff;border-bottom:3px solid var(--g)}
nav button{border:2px solid var(--n);background:var(--w);color:var(--n);border-radius:20px;padding:5px 12px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--n);color:#fff}nav button.done::after{content:" ✓";color:var(--ok);font-weight:700}nav button.on.done::after{color:var(--g)}
main{max-width:980px;margin:0 auto;padding:18px}h2{font:700 1.7rem Georgia,serif;margin:.2em 0}
.card{background:var(--w);border:2px solid var(--n);border-radius:14px;padding:14px 18px;margin:14px 0}
.paper{border-left:8px solid var(--g);background:#fff4d1;padding:10px 14px;border-radius:6px;margin:12px 0}
.q{padding:8px 10px;margin:8px 0;border-left:5px solid #ccc;background:#fff}.q.ok{border-color:var(--ok)}.q.ko{border-color:var(--ko)}
.q p{margin:0 0 4px}.fb{font-size:.9rem;min-height:1em}.ok .fb{color:var(--ok)}.ko .fb{color:var(--ko)}
select,input[type=text],textarea{font:inherit;padding:4px 6px;border:2px solid var(--n);border-radius:8px;background:#fff;color:var(--n)}
input.num{width:90px}textarea{width:100%;min-height:70px}.c{display:inline-block;margin:2px 12px 2px 0}
.btn{background:var(--g);color:var(--n);border:0;border-radius:24px;padding:9px 20px;font:700 1rem inherit;cursor:pointer;margin:6px 6px 6px 0}.btn.s{background:var(--n);color:#fff}
.sc{font-weight:700}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border:1.5px solid var(--n);padding:5px;text-align:center;font-size:.9rem}th{background:var(--n);color:#fff}
td.ok{background:#d9f0cc}td.ko{background:#f6d5cd}td svg{height:90px;width:130px}.fig{display:flex;flex-wrap:wrap;gap:10px}.fig div{text-align:center;font-weight:700}.fig svg{height:110px;width:160px}
.hero{text-align:center}.hero img{width:260px;max-width:70%}.steps li{margin:4px 0}.pv{display:none}
footer{text-align:center;font-size:.8rem;padding:14px;opacity:.7}
@media print{body *{visibility:hidden}#lesson,#lesson *{visibility:visible}#lesson{position:absolute;left:0;top:0;width:100%}textarea{display:none}.pv{display:block;white-space:pre-wrap}.no{display:none}}
</style></head><body>

<div class="card"><h3>Ton matériel</h3><p>Le cahier d’activités (PDF imprimé), une règle graduée, une équerre, un compas, un crayon.</p><ol class="steps"><li>Je lis la mission sur le site.</li><li>Je fais le travail sur ma feuille (tracés, mesures…).</li><li>Je reviens sur le site pour répondre et vérifier.</li></ol><button class="btn" onclick="go(1)">Commencer</button></div>`,
()=>`<h2>Mission 1 · Le vocabulaire</h2>${paper('page 1','colorie les diagonales en rouge, deux côtés opposés en bleu, deux côtés consécutifs en vert, puis marque un angle.')}<div class="card"><div class="fig"><div>${svg('V',{l:1,d:1})}</div></div>`+quiz('q1',[{q:'Le segment [AC] est…',o:['un côté','une diagonale','un sommet'],a:'une diagonale',e:'Une diagonale relie deux sommets opposés.'},{q:'[AB] et [CD] sont deux côtés…',o:['opposés','consécutifs'],a:'opposés',e:'Ils ne se touchent pas.'},{q:'[AB] et [BC] sont deux côtés…',o:['opposés','consécutifs'],a:'consécutifs',e:'Ils partagent le sommet B.'},{q:'A et C sont deux sommets…',o:['opposés','consécutifs'],a:'opposés'},{q:'Combien un quadrilatère a-t-il de diagonales ?',o:['1','2','4'],a:'2'}])+'</div>',
()=>`<h2>Mission 2 · Observer et mesurer</h2>${paper('pages 2 et 3','mesure les côtés, vérifie les parallèles et les angles droits avec la règle et l’équerre, trace les diagonales, mesure-les et cherche leur milieu. Remplis le tableau.')}<div class="card wrap"><table><tr><th>Figure</th>${COLS.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${'ABCDEF'.split('').map(k=>`<tr><td>${svg(k)}<br><b>${k}</b></td>${COLS.map((c,j)=>`<td data-k="${k}" data-j="${j}"><select><option value="">?</option>${c[1].map(o=>`<option>${o}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</table></div><button class="btn" onclick="gchk()">Vérifier le tableau</button><span class="sc" id="gs"></span>
<div class="card" id="obs" hidden><b>Bien joué !</b> Observe : les figures A et B ont des diagonales égales, A et C des diagonales perpendiculaires, A, B, C et D des diagonales de même milieu. Garde ces observations en tête !</div>`,
()=>`<h2>Mission 3 · Construire</h2>${paper('page 4','réalise les trois constructions, trace les diagonales et mesure-les.')}<div class="card">${quiz('q3',[{q:'Carré de côté 4 cm : longueur d’une diagonale (arrondie au 0,1 cm près)',t:.3,a:5.66,u:'cm',e:'Environ 5,7 cm.'},{q:'Rectangle de 6 cm sur 3 cm : longueur d’une diagonale',t:.3,a:6.7,u:'cm',e:'Environ 6,7 cm.'},{q:'Rectangle : les deux diagonales ont-elles la même longueur ?',o:['oui','non'],a:'oui'},{q:'Losange avec [AC] = 7 cm et [BD] = 4 cm (diagonales perpendiculaires, de même milieu) : longueur d’un côté',t:.3,a:4.03,u:'cm',e:'Environ 4 cm : les 4 côtés sont égaux.'},{q:'Dans tes trois figures, laquelle n’a pas ses diagonales égales ?',o:['le carré','le rectangle','le losange'],a:'le losange'}])}</div>`,
()=>`<h2>Mission 4 · Qui suis-je ?</h2><p>Coche <b>toutes</b> les figures possibles.</p><div class="card">${quiz('q4',[{q:'J’ai 4 angles droits.',o:NOM,a:['carré','rectangle']},{q:'J’ai 4 côtés égaux.',o:NOM,a:['carré','losange']},{q:'Mes diagonales sont perpendiculaires et de même milieu.',o:NOM,a:['carré','losange']},{q:'Mes diagonales ont la même longueur.',o:NOM,a:['carré','rectangle']},{q:'J’ai exactement une paire de côtés parallèles.',o:NOM,a:['trapèze'],e:'Les autres en ont deux.'}].map(x=>({...x,h:'Teste chaque figure avec ce que tu as mesuré.'})))}</div>
<h3>Vrai ou faux ?</h3><div class="card">${quiz('q4b',[{q:'Tout carré est un rectangle.',o:['vrai','faux'],a:'vrai',e:'Un carré a 4 angles droits et ses côtés opposés parallèles et égaux.'},{q:'Tout rectangle est un carré.',o:['vrai','faux'],a:'faux',e:'Un rectangle n’a pas forcément 4 côtés égaux.'},{q:'Tout losange est un parallélogramme.',o:['vrai','faux'],a:'vrai',e:'Il a 2 paires de côtés parallèles.'},{q:'Tout losange est un carré.',o:['vrai','faux'],a:'faux',e:'Un losange n’a pas forcément d’angles droits.'}])}</div>`,
()=>`<h2>Mission 5 · Reconstruis le tableau</h2>${paper('page 5','complète le tableau vide avec ce que tu as découvert.')}<p>Coche les propriétés qui sont <b>toujours vraies</b>.</p><div class="card wrap"><table><tr><th></th>${PR.map(p=>`<th>${p}</th>`).join('')}</tr>${NOM.map((n,i)=>`<tr><th>${n}</th>${PR.map((p,j)=>`<td data-i="${i}" data-j="${j}"><input type="checkbox"></td>`).join('')}</tr>`).join('')}</table></div><button class="btn" onclick="mchk()">Vérifier</button><span class="sc" id="ms"></span>
<h3>Les liens entre les quadrilatères</h3><div class="card">${quiz('q5',[{q:'Tout carré est un losange.',o:['vrai','faux'],a:'vrai'},{q:'Tout rectangle est un parallélogramme.',o:['vrai','faux'],a:'vrai'},{q:'Tout parallélogramme est un trapèze.',o:['vrai','faux'],a:'vrai',e:'Il a au moins une paire de côtés parallèles.'},{q:'Tout trapèze est un parallélogramme.',o:['vrai','faux'],a:'faux'},{q:'Tout parallélogramme est un rectangle.',o:['vrai','faux'],a:'faux'}])}</div>`,
()=>`<h2>Ma leçon</h2><p class="no">Écris chaque phrase avec tes mots. Un doute ? Clique sur « Voir un exemple ».</p><div class="card" id="lesson"><h3>Les quadrilatères – Je retiens</h3>
<table><tr><th></th>${PR.map(p=>`<th>${p}</th>`).join('')}</tr>${NOM.map((n,i)=>`<tr><th>${n}</th>${MX[i].map(v=>`<td>${v?'✔':''}</td>`).join('')}</tr>`).join('')}</table>
${[...NOM,'pièges','astuce'].map(k=>`<p><b>${{pièges:'Les pièges à éviter',astuce:'Mon astuce',...Object.fromEntries(NOM.map(n=>[n,'Le '+n]))}[k]} :</b></p><textarea id="t-${k}" placeholder="${k=='astuce'?'Comment reconnaître un quadrilatère ?':'…'}"></textarea><div class="pv"></div><button class="btn s no" onclick="$('#t-${k}').value=MODEL['${k}']">Voir un exemple</button>`).join('')}
</div><button class="btn" onclick="imp()">Imprimer ma leçon</button>`];
let cur=0;
function nav(){$('#nav').innerHTML=T.map((t,i)=>`<button class="${i==cur?'on ':''}${REQ[i].length&&REQ[i].every(x=>DONE.has(x))?'done':''}" onclick="go(${i})">${t}</button>`).join('')}
function go(i){cur=i;$('#app').innerHTML=ST[i]()+(i?`<button class="btn s" onclick="go(${i-1})">← Précédent</button>`:'')+(i<6&&i?`<button class="btn" onclick="go(${i+1})">Suivant →</button>`:'');nav();scrollTo(0,0)}
function gchk(){let ok=0;$$('td[data-k]').forEach(td=>{const r=$('select',td).value===KEY[td.dataset.k][td.dataset.j];td.className=r?'ok':'ko';ok+=r});$('#gs').textContent=` ${ok}/36`;if(ok==36){DONE.add('grid');$('#obs').hidden=false;nav()}}
function mchk(){let ok=0;$$('td[data-i]').forEach(td=>{const r=$('input',td).checked==!!MX[td.dataset.i][td.dataset.j];td.className=r?'ok':'ko';ok+=r});$('#ms').textContent=` ${ok}/35`;if(ok==35){DONE.add('mx');nav()}}
function imp(){$$('textarea').forEach(t=>t.nextElementSibling.textContent=t.value);print()}
go(0);
</script></body></html>
